scope:
  target: {model: RTM3004, host: 192.168.50.3, port: 5025}
  channels:
    - {channel: 1, signal: CS, source: P9_17, termination: 1_Mohm, coupling: DCLimit, probe_attenuation: 10, max_abs_input_v: 3.3}
    - {channel: 2, signal: CLK, source: P9_22, termination: 1_Mohm, coupling: DCLimit, probe_attenuation: 10, max_abs_input_v: 3.3}
    - {channel: 3, signal: MOSI, source: P9_18, termination: 1_Mohm, coupling: DCLimit, probe_attenuation: 10, max_abs_input_v: 3.3}
    - {channel: 4, signal: MISO, source: P9_21, termination: 1_Mohm, coupling: DCLimit, probe_attenuation: 10, max_abs_input_v: 3.3}

hardware_safety:
  devices:
    - {kind: scope, model: RTM3004, host: 192.168.50.3, port: 5025}
  scope_channels:
    - {channel: 1, signal: CS, source: P9_17, termination: 1_Mohm, coupling: DCLimit, probe_attenuation: 10, max_abs_input_v: 3.3}
    - {channel: 2, signal: CLK, source: P9_22, termination: 1_Mohm, coupling: DCLimit, probe_attenuation: 10, max_abs_input_v: 3.3}
    - {channel: 3, signal: MOSI, source: P9_18, termination: 1_Mohm, coupling: DCLimit, probe_attenuation: 10, max_abs_input_v: 3.3}
    - {channel: 4, signal: MISO, source: P9_21, termination: 1_Mohm, coupling: DCLimit, probe_attenuation: 10, max_abs_input_v: 3.3}
  stop_conditions:
    - Stop if a live device identity or endpoint differs from this profile.
    - Stop unless the scope inputs read back as DCLimit/high impedance with 10x attenuation.
    - Stop if a scope input exceeds 3.3 V.
    - Stop on register mismatch, missing MISO, absent trigger, timeout, or ambiguous board state; do not retry automatically.

jtag:
  scan_xcf: QKD_PROJ/boards/rtase-v1/v1.0/jtag-scan.xcf
  # Historical CLI fallback only. Conversation jobs supply their workspace XCF.
  program_xcf: QKD_PROJ/boards/rtase-v1/v1.0/gpio-spi-code-registers-sram.xcf
