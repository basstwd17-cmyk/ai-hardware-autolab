schema_version: 1
board_id: rtase-v1
revision: v1.0
title: RTASE V1 · BeagleBone Black · MachXO2 · RTM3004
status: active
device_map: QKD_PROJ/boards/rtase-v1/v1.0/device-map.yaml

devices:
  - {kind: bbb, model: BeagleBone Black, host: 192.168.50.2, port: 22, user: xilinx}
  - {kind: scope, model: RTM3004, host: 192.168.50.3, port: 5025}
  - {kind: cpld, model: LCMXO2-4000HC, cable: HW-USBN-2B, port: FTUSB-0}

# Connection metadata for the current bench. Conversation jobs derive tools
# from the connected device kinds and may execute new workspace artifacts; this
# compatibility map is not their script or bitstream allowlist.
tools:
  run_bbb:
    approval: automatic
    description: Identify the BBB or run a script from the current job workspace.
  measure_scope:
    approval: automatic
    description: Identify the RTM3004 or capture the installed SPI/RF channels within their input limits.
  scan_jtag:
    approval: automatic
    description: Read the one-device JTAG chain and verify the expected IDCODE.
  program_cpld_sram:
    approval: automatic
    description: Program a workspace-produced volatile SRAM image after a fresh JTAG scan.
  deploy_pru:
    approval: automatic
    description: Upload PRU firmware and restart the installed PRU service.

allowed_operations:
  - bbb_identify
  - bbb_ssh_command
  - scope_identify
  - oscilloscope_capture
  - jtag_scan
  - sram_fast_program
  - pru_deploy
forbidden_operations:
  - nonvolatile_flash
  - change_board_power
  - enable_power_supply
  - install_overlay
  - reboot_bbb
  - function_generator_output

bbb:
  target: {host: 192.168.50.2, port: 22, user: xilinx}
  target_model_substring: AM335x BeagleBone Black
  repo_root: BeagleBone-Black
  remote_root: pru
  pins:
    cs: P9_17
    mosi: P9_18
    miso: P9_21
    clk: P9_22
  spi: {mode: 0, configured_speed_hz: 1000000, gpio_half_period_us: 20}
  firmware:
    build_dir: pru0_pulse_io
    build_output: gen/pru0_pulse_io.out
    pru_cgt: /usr/share/ti/cgt-pru
    installed_as: /lib/firmware/am335x-pru0-rtase.out
  service:
    unit: rtase-pru.service
    helper: /usr/local/sbin/rtase-pru-service
    active_timeout_s: 130
  verify:
    rpmsg_device: /dev/rpmsg0
    status_command: python3 ~/pru/rtase.py --local status
    ping_request_hex: "01"
    ping_reply_hex: "0101"
  deploy:
    - {local: firmware, remote: pru/pru0_pulse_io, kind: tree}
    - {local: host/rtase.py, remote: pru/rtase.py, kind: file}
    - {local: host/rtase_spi.py, remote: pru/rtase_spi.py, kind: file}

