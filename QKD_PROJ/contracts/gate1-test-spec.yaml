  status: executed
  pinned_on: 2026-08-18
  approved: false
  approved_by: user
  approved_on: 2026-08-18
  approval_scope: SRAM Fast Program only
  approval_max_executions: 2
  approval_executions_used: 2
  additional_execution_approved_on: 2026-08-18
  additional_execution_reason: >-
    Power was removed to attach and verify the Gate 1 pin 117 temporary probe
    wire, which cleared the volatile SRAM configuration. The user approved one
    additional SRAM Fast Program of the same pinned raw SHA-256 artifact.
  latest_execution_on: 2026-08-18T04:58:29Z
  latest_execution_run: no_run_record_pytest_preflight
  latest_execution_result: PASS
  latest_execution_record_missing: true
  latest_execution_note: >-
    The approved second execution was inadvertently invoked by
    test_consumed_real_approval_cannot_be_reused after the production contract
    was reopened. pgrcmd returned success in 14.891 s, but the test supplied a
    fixture scan result and no RunRecord. Do not reprogram; verify the live
    chain with a real scan before measurement.
  executed_on: 2026-08-18T02:28:58Z
  execution_run: 20260818T022845Z_gate1_sram_program
  execution_result: PASS
  execution_current_limit_reached: false
  execution_anomalies: none_reported
  directory: QKD_PROJ/candidates/gate1-sram
  bitstream: gate1_gpio_toggle_impl1.bit
  from_run: 20260814T052133Z_gate1_build_final_3
  # THIS is the identity an approval is granted against. A rebuild of the same
  # sources produces a different value here and is therefore a different
  # artifact, not the approved one.
  bitstream_sha256: c656c41ab34df655fb1d638d4af25439ff45fd3f70a73692fad3519085463910
  bitstream_bytes: 16271
  # Stable across rebuilds, so it answers "same design?" and nothing else.
  # Must never be used to name an approval target.
  bitstream_design_sha256: 71c6be3a3b01b00b0d94f1af329529dff83f4711545597cba777722e2c961866
  source_sha256:
    gate1_gpio_toggle.v: 80f744afedc6ef78ada9993b938cee5385fb3bde940d1e269f430f627e18dbf1
    gate1_gpio_toggle.lpf: 3d157ed8897fcfe1954ac70cc7c7d1aa98c0de0d53742f11a2d602e8f0fb0b45
  companion_sha256:
    gate1_gpio_toggle_impl1.pad: 4f2ad93ce7865dee67ee73059dd314682423fb0966cd5a8ca5e49dd81efd6026
    build.log: 6a29797d789f51cf3f92a440b71734bf0d2bd420dd7d258df6f502a02249488a
    manifest.json: f9ef4f7fe76bd18ff1e6ac74f8d9d1d9c8c24fa378bc89ee0196db5ef7b0e86f
  toolchain:
    diamond: 3.14.0.75.2
    diamond_root: 'C:\lscc\diamond\3.14'
  # runs/ is excluded by .gitignore:35, so the original copy is untracked and a
  # git clean would delete it. The candidate directory is tracked instead.
  immutable: true
  immutability_enforced_by: QKD_PROJ/tests/test_gate1_candidate.py
  replacement_policy: >-
    Never overwrite this directory with a rebuild. If the design changes, pin a
    new candidate directory and issue a new approval form. An approval names a
    file, not a design.
  approval_form: QKD_PROJ/candidates/gate1-sram/APPROVAL-2.md
  blocked_by: []
  # program_cpld_sram() reads this pinned contract directly and refuses any
  # XCF that names another file. The one permitted execution is now consumed.
  consumed_by: program_cpld_sram()

artifacts:
  # Every run writes runs/<UTC>_<name>/ containing manifest.json and
  # run_status.json. The manifest holds the contract snapshot, the SCPI or
  # command transcript, all measurements and every artifact hash. Values listed
  # under "recorded" live inside the manifest; values under "files" are copied
  # into the run directory and hashed.
  run_directory:
    - manifest.json
    - run_status.json
  build:
    files:
      - build.log
      - "*.bit"
      - "*.pad"
    recorded:
      - versions.diamond
      - measurements.source_sha256
      - measurements.bitstream_sha256
      - measurements.bitstream_design_sha256
      - measurements.user_io
      - measurements.drc_errors
      - measurements.timing_errors
      - measurements.timing_preferences
  jtag_scan:
    status: implemented_and_passed
    latest_run: 20260818T022845Z_gate1_sram_program
    recorded:
      - measurements.device_count
      - measurements.idcode
  program_sram:
    status: implemented_and_passed
    latest_run: 20260818T022845Z_gate1_sram_program
    files:
      - program.log
    recorded:
      - measurements.approved_bitstream_sha256
      - measurements.programmed_bitstream_sha256
  gpio_measurement:
    status: implemented_mock_verified_pending_physical_access
    files:
      - "*.png"
      - "*.csv"
    recorded:
      - measurements.sample_count
      - measurements.retrieval_path
      - measurements.observed_edge_count
      - measurements.observed_low_v
      - measurements.observed_high_v
      - measurements.voltage_limit_violations
      - measurements.CH*_termination
      - measurements.CH*_probe_attenuation

gpio_measurement_approval:
  status: approved
  approved: true
  approved_by: user
  approved_on: 2026-08-18
  approval_scope: CH3 oscilloscope capture of isolated dbg0 on CPLD pin 117
  approval_max_executions: 3
  approval_executions_used: 0
  channel: CH3
  required_termination: 1_Mohm
  probe_attenuation: "10:1"
  probe_ground: U4_pin_7
  approval_form: QKD_PROJ/contracts/approvals/gate1-gpio-measurement-20260818.md

pass_criteria:
  consecutive_runs: 3
  build_errors: 0
  build_warnings_requiring_review: 0
  expected_device_count: 1
  expected_idcode: "0x012BC043"
  sram_program_success: true
  voltage_limit_violations: 0
  # Frequency is NOT judged at Gate 1. This previously read 5 percent, which
  # contradicted test_design.clock.osch_accuracy and would have asserted a
  # tolerance no datasheet supports. Gate 1 asks whether a safe pin toggles
  # repeatably, not whether it is accurately 1 Hz.
  waveform_frequency_tolerance_percent: null
  waveform_must_toggle: true
  waveform_minimum_observed_edges: 4

stop_conditions:
  - JTAG IDCODE differs from 0x012BC043.
  - More than one JTAG device is detected.
  - U4 orientation or ground reference is uncertain.
  - Board current exceeds the bench supply limit.
  - The proposed probe point cannot be accessed without short-circuit risk.
  - Any DAC clock, DAC data, SPI clock, or analog output toggles unexpectedly.
