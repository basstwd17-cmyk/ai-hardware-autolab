schema_version: 1
test_id: gate1-jtag-sram-gpio
status: blocked_pending_human_review
architecture_profile: windows_single_pc_cli
automation_policy:
  order:
    - manual_hardware_proof
    - deterministic_python_cli
    - ai_after_hardware_gates
  web_ui_in_scope: false
  ai_control_in_scope: false
board:
  name: RTASE_V1
  revision: V1.0
  cpld_part: LCMXO2-4000HC-4TG144C
  expected_idcode: "0x012BC043"

purpose:
  - Confirm that the expected MachXO2 is the only JTAG target.
  - Build and load a minimal test design into SRAM.
  - Observe one electrically isolated 3.3 V GPIO without driving BBB, DAC, or SPI nets.

allowed_operations:
  - power_off_continuity_check
  - jtag_scan
  - diamond_build
  - sram_fast_program
  - readback_or_program_status
  - oscilloscope_capture

forbidden_operations:
  - nonvolatile_flash
  - drive_pin_34_SPI_CLK
  - drive_pin_35_LDASC_A
  - drive_any_D1B_or_D2B_bus
  - enable_analog_output
  - power_board_without_current_limit

jtag:
  cable: Lattice HW-USBN-2B
  port: FTUSB-0
  header: U4
  expected_header_map:
    1: VREF_3V3
    2: TDO
    3: TDI
    4: NC
    5: NC
    6: TMS
    7: GND
    8: TCK
  preconditions:
    - Verify U4 pin 1 orientation from the PCB silkscreen or continuity test.
    - With power off, confirm U4 pin 7 continuity to GND.
    - With power on and current limited, confirm U4 pin 1 is 3.3 V.
    - JTAG scan must return exactly one device with IDCODE 0x012BC043.

test_design:
  top: gate1_gpio_toggle
  source_status: built_not_programmed
  sources:
    hdl: QKD_PROJ/gate1_cpld/gate1_gpio_toggle.v
    constraints: QKD_PROJ/gate1_cpld/gate1_gpio_toggle.lpf
  output:
    name: dbg0
    cpld_pin: 117
    site: PT24A
    io_type: LVCMOS33
    drive_ma: 4
    slew: SLOW
    board_connection: NC_on_schematic
    required_access: temporary_wire_or_verified_direct_probe
    physical_access_approved: true
    physical_access_approved_on: 2026-08-18
    physical_access_approved_by: user
    physical_access_method: temporary_wire_to_pin_117
    scope_channel: CH3
    probe_attenuation: "10:1"
    probe_ground: U4_pin_7
    adjacent_pin_short_check: passed_for_pins_116_and_118
  clock:
    source: OSCH
    nom_freq_mhz: 2.08
    divider_half_period_cycles: 1040000
    # OSCH accuracy is NOT established. It is absent from the Diamond libraries
    # and webhelp, and the MachXO2 datasheet is not available locally. Until it
    # is, no frequency tolerance may be derived from the nominal value.
    osch_accuracy:
      resolved: false
      blocks: frequency_tolerance_percent
      needed_from: MachXO2 family datasheet, internal oscillator specification
  behavior:
    waveform: square
    nominal_frequency_hz: 1.0
    frequency_tolerance_percent: null  # blocked by osch_accuracy above
    low_v_max: 0.4
    high_v_min: 2.4
    high_v_max: 3.6
    # Gate 1 proves that a safe output toggles repeatably. It is not a frequency
    # measurement, and must not be judged as one.
    intent: repeatable_toggle_not_frequency_accuracy

build_result:
  verified_on: 2026-08-14
  diamond: 3.14.0.75.2
  consecutive_passing_builds: 3
  runs:
    # Corrected 2026-08-18: the first two entries named directories that do
    # not exist. Checked against runs/ on disk.
    - 20260814T052115Z_gate1_build_final_1
    - 20260814T052123Z_gate1_build_final_2
    - 20260814T052133Z_gate1_build_final_3
  source_sha256:
    gate1_gpio_toggle.v: 80f744afedc6ef78ada9993b938cee5385fb3bde940d1e269f430f627e18dbf1
    # Added 2026-08-18. The LPF places the pin, so leaving it out meant the
    # bitstream could not be attributed to a complete source revision.
    gate1_gpio_toggle.lpf: 3d157ed8897fcfe1954ac70cc7c7d1aa98c0de0d53742f11a2d602e8f0fb0b45
  # Full digest, not a prefix: this is the identity an approval is granted
  # against and an audit is checked against. Identical across all three runs.
  bitstream_design_sha256: 71c6be3a3b01b00b0d94f1af329529dff83f4711545597cba777722e2c961866
  placed_io:
    dbg0: {pin: 117, bank: 0, site: PT24A, buffer: LVCMOS33_OUT, drive_ma: 4, slew: SLOW}
  user_io_count: 1
  pio_sites_used: 1 user + 4 JTAG out of 115
  drc_errors: 0
  timing_errors: 0
  timing_preference: FREQUENCY NET "osc_clk" 2.080000 MHz
  max_frequency_mhz: 104.943
  # The full-file hash changes on every build because Diamond stamps the build
  # time into the header; only 2 of 16271 bytes differ. Approval for programming
  # must pin one specific artifact, not a rebuild.
  bitstream_byte_reproducible: false

# The one artifact approval 2 will name. Pinned 2026-08-18. This is NOT an
# approval -- it fixes the target so the approval can point at something that
# cannot silently change. See candidates/gate1-sram/CANDIDATE.md for why this
# build was chosen out of the three, and APPROVAL-2.md for the unsigned form.
