gpio_spi_fallback_result:
  run: 20260820T063111Z_gate10_gpio0_3_clocked_return
  overlay: BB-RTASE-A-GPIO-SPI-00A0.dtbo
  pinmux:
    P9_17_CS: {gpio: GPIO0_5, padconf: 0x07, direction: output}
    P9_18_MOSI: {gpio: GPIO0_4, padconf: 0x07, direction: output}
    P9_21_MISO: {gpio: GPIO0_3, padconf: 0x27, direction: input}
    P9_22_SCLK: {gpio: GPIO0_2, padconf: 0x07, direction: output}
  expected_rx: a55a3cc3f00f
  observed_rx: a55a3cc3f00f
  verdict: PASS
  conclusion: >-
    BBB GPIO0_3 reads the complete CPLD response when the boot overlay owns
    the four SPI nets. This clears a damaged CPU input pad and establishes a
    working GPIO-SPI fallback. Standard McSPI/spidev remains disabled in this
    boot profile and its all-zero RX issue remains separately unresolved.

stop_conditions:
  - Any output other than U2 pin 33 is placed.
  - U2 pin 33 is not a 3.3 V LVCMOS output with 4 mA slow slew.
  - Any DAC, SMA, PRU, or analog-output pin is configured as an output.
