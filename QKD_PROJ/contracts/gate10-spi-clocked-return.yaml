schema_version: 1
test_id: gate10-spi-clocked-return
status: gpio_spi_fallback_verified_mcspi_rx_fault_isolated

purpose:
  - Verify BBB mode-0 MISO sampling using data launched by the CPLD on SCLK falling edges.
  - Drive no DAC, SMA, PRU, status, or analog-output net.

allowed_operations: [diamond_build, jtag_scan, sram_fast_program, readback_or_program_status, scope_identify, oscilloscope_capture]
forbidden_operations: [nonvolatile_flash, drive_any_D1B_bus, drive_D1CLK, drive_any_D2B_bus, drive_D2CLK, enable_analog_output]

jtag:
  cable: Lattice HW-USBN-2B
  port: FTUSB-0
  header: U4

test_design:
  top: spi_clocked_return
  sources:
    hdl: QKD_PROJ/spi_clocked_return/spi_clocked_return.v
    constraints: QKD_PROJ/spi_clocked_return/spi_clocked_return.lpf
  signal_path:
    chip_select: {bbb_pin: P9_17, cpld_pin: 32, direction: input, active: low}
    return: {cpld_pin: 33, bbb_pin: P9_21, direction: output}
    clock: {bbb_pin: P9_22, cpld_pin: 34, direction: input, mode: 0}
  fixed_response_hex: a55a3cc3f00f
  excluded_outputs: [D1B, D1CLK, D2B, D2CLK, SMA, PRU, status]

pass_criteria:
  build_errors: 0
  timing_errors: 0
  expected_user_io_count: 3
  expected_device_count: 1
  expected_idcode: 0x012BC043
  expected_response_hex: a55a3cc3f00f

scope_capture:
  approval: user_requested_on_2026_08_20
  channel_map:
    CH1: {signal: chip_select, bbb_pin: P9_17, cpld_pin: 32}
    CH2: {signal: mosi, bbb_pin: P9_18, cpld_pin: 31}
    CH3: {signal: miso, bbb_pin: P9_21, cpld_pin: 33}
    CH4: {signal: sclk, bbb_pin: P9_22, cpld_pin: 34}
  required_front_end: {coupling: DCLimit, termination: 1_Mohm, probe_attenuation: '10:1'}
  trigger: {source: CH4, edge: rising, level_v: 1.65}
  operation_scope: >-
    One scope-triggered BBB SPI0 mode-0 read at 100 kHz through the existing
    clocked-response design. The capture configures only the oscilloscope;
    it does not reprogram the CPLD, reboot BBB, or drive any DAC/SMA net.
  result:
    run: 20260820T055246Z_gate10_scope_clocked_return_5838ca97
    verdict: PASS_scope_electrical_response
    scope_mode0_mosi_hex: 000000000000
    scope_mode0_miso_hex: a55a3cc3f00f
    expected_miso_hex: a55a3cc3f00f
    sclk_frequency_hz: 100040.01600640255
    clock_rising_edges_in_frame: 48
    scope_front_end: {all_channels: 'DCLimit / 1_Mohm / 10:1'}
    concurrent_bbb_spidev_rx: 000000000000
    conclusion: >-
      The CPLD drives the full expected response onto P9_21 at the mode-0
      sample edges, while the identical transfer is returned as all zero by
      BBB spidev. CPLD logic, MISO wiring, and SPI-edge timing are cleared;
      BBB MISO receive/pad/kernel McSPI path remains the fault domain.
    artifacts:
      summary: runs/20260820T055246Z_gate10_scope_clocked_return_5838ca97/summary.json
      waveform: runs/20260820T055246Z_gate10_scope_clocked_return_5838ca97/waveforms.json.gz
      screenshot: runs/20260820T055246Z_gate10_scope_clocked_return_5838ca97/capture.png
    tool_sha256:
      bbb_spi_clocked_response_verify.sh: 735c91d33748dce731fde0a909a19178b00f7a756782fe311120bb2d128aac72
      spi_clocked_return_scope_capture.py: 4841ee611efac60aa16eb39bdbad49eef2949198f47b87e23e234dc3b1c795fa

