verification_sequence:
  - name: digital_timing
    prerequisites: [CN1_disconnected, Gate12_candidate_approved_for_SRAM_only]
    observations: [SYM_A0, SYM_A1, P9_31, D1CLK, representative_D1B_bits]
  - name: dac_code_response
    prerequisites: [digital_timing_passed, CN1_disconnected]
    observations: [small_code_delta, DAC1_OUT_baseline, current_and_temperature]
  - name: rf1_analog_bringup
    prerequisites: [explicit_analog_power_approval, CN1_rails_verified, RF1_50ohm_load_confirmed]
    observations: [RF1_waveform, amplitude, settling, overshoot, supply_current]
  - name: automated_run
    prerequisites: [all_previous_gates_passed]
    operations: [preflight, code_write_readback, pru_sequence_load, pru_run, scope_capture, immutable_run_record]

hard_stops:
  - The one approved Gate12 SRAM execution has been consumed; a reload requires new approval.
  - No Gate12 SRAM program without a separate approved immutable candidate.
  - No CN1 connection or RF1 measurement without explicit analog-power approval.
  - Stop on current limit, rail droop, unexpected DAC1_OUT/RF1 level, or abnormal temperature.
  - Do not use the existing fixed-code gate3 candidate as the writable-code Gate12 implementation.
