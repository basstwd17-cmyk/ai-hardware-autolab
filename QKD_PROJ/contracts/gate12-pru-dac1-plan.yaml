schema_version: 1
test_id: gate12-pru-dac1-plan
status: digital_control_path_verified_scope_limited

allowed_operations: [diamond_build, readback_or_program_status]
forbidden_operations:
  - jtag_scan
  - sram_fast_program
  - nonvolatile_flash
  - enable_analog_output
  - drive_any_D2B_bus
  - drive_D2CLK

purpose:
  - Record the approved-by-design sequence for the first channel-A PRU to CPLD to DAC1 test.
  - Preserve Gate11 GPIO-SPI CODE0..CODE3 as the one-time configuration transport.
  - Prevent a DAC, amplifier, or RF1 operation until an independent candidate and approval exist.

dependencies:
  gpio_spi_protocol_contract: contracts/gate11-gpio-spi-code-registers.yaml
  board_map: contracts/board-map.yaml
  schematic: RTASE_V1_Schematic1_2026-08-13.pdf
  current_bbb_overlay: BB-RTASE-A-GPIO-SPI-00A0.dtbo

jtag:
  cable: Lattice HW-USBN-2B
  port: FTUSB-0
  header: U4

verified_inputs:
  jtag: {device_count: 1, idcode: 0x012BC043}
  gpio_spi:
    transport: GPIO0
    pins: {cs: P9_17, mosi: P9_18, miso: P9_21, sclk: P9_22}
    readback: {CODE0: 0x0001, CODE1: 0x0123, CODE2: 0x2345, CODE3: 0x3FFE}
    bit_errors: 0
  mcspi_spidev:
    status: receive_fault_isolated_not_a_gate12_dependency
  cpld_configuration:
    type: volatile_sram
    warning: cleared_by_power_loss_or_bbb_reboot

channel_a_path:
  code_setup: {transport: GPIO-SPI, registers: [CODE0, CODE1, CODE2, CODE3], width_bits: 14}
  selection:
    - {pru: PRU0_R30_15, bbb_pin: P8_11, cpld_pin: 85, net: SYM.A0}
    - {pru: PRU0_R30_14, bbb_pin: P8_12, cpld_pin: 84, net: SYM.A1}
  update: {pru: PRU0_R30_0, bbb_pin: P9_31, cpld_pin: 35, net: LDASC.A}
  dac:
    reference: U6
    part: AD9744ARUZRL7
    data_bus: {net: D1B, cpld_pins_lsb_to_msb: [56, 57, 58, 59, 60, 61, 62, 63, 65, 67, 68, 69, 70, 71]}
    clock: {net: D1CLK, cpld_pin: 73, dac_pin: 28, edge: rising}
  amplifier:
    reference: U5
    part: THS3491IRGTR
    rails: {connector: CN1, positive: '+15V', negative: '-15V'}
    gain_nominal_v_per_v: 10.1
    output: {connector: RF1, series_resistance_ohm: 49.9, required_load_ohm: 50}

bbb_preparation:
  required_overlay: combined_gpio_spi_and_pru_channel_a
  required_pru_pins: [P8_11, P8_12, P9_31]
  hdmi_release_settings: [disable_uboot_overlay_audio=1, disable_uboot_overlay_video=1]
  required_checks_after_reboot: [ssh, pru_ping, pru_version, GPIO-SPI_pinmux]
  ordering_constraint: reboot_before_any_new_cpld_sram_program

required_cpld_behavior:
  code_selection: CODE0_to_CODE3_by_SYM_A1_A0
  program_guard: reject_or_serialize_spi_code_writes_during_pru_run
  pru_timing:
    selection_setup_ns_minimum: 100
    update_pulse_high_ns_nominal: 20
    requirement_basis: AD9744_data_setup_2ns_hold_1_5ns_latch_pulse_width_1_5ns
  allowed_outputs: [SPI.MISO, D1B, D1CLK]
  prohibited_outputs: [D2B, D2CLK, RF2, status, unrelated_gpio]

test_design:
  top: gate12_pru_dac1
  sources:
    hdl: QKD_PROJ/gate12_pru_dac1/gate12_pru_dac1.v
    constraints: QKD_PROJ/gate12_pru_dac1/gate12_pru_dac1.lpf
  expected_user_io_count: 22
  startup_codes: [0x0000, 0x0000, 0x0000, 0x0000]
  outputs:
    - {name: spi_miso, cpld_pin: 33, io_type: LVCMOS33, drive_ma: 4, slew: SLOW}
    - {name: D1B, cpld_pins_lsb_to_msb: [56, 57, 58, 59, 60, 61, 62, 63, 65, 67, 68, 69, 70, 71], io_type: LVCMOS33, drive_ma: 4, slew: SLOW}
    - {name: d1clk, cpld_pin: 73, io_type: LVCMOS33, drive_ma: 8, slew: FAST}

pass_criteria:
  build_errors: 0
  timing_errors: 0
  expected_device_count: 1
  expected_idcode: 0x012BC043
  exact_user_io_count: 22
  exact_dac_channel_outputs: [D1B, D1CLK]
  prohibited_outputs_absent: [D2B, D2CLK]

