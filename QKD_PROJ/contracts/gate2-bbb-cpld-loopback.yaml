schema_version: 1
test_id: gate2-bbb-cpld-loopback
status: build_candidate_only

purpose:
  - Prove a signal generated by BBB PRU0 reaches the CPLD.
  - Observe the received value on isolated CPLD pin 117.
  - Do not drive either DAC data bus, DAC clock, SPI clock, or analog output.

allowed_operations:
  - diamond_build

forbidden_operations:
  - sram_fast_program
  - nonvolatile_flash
  - drive_any_D1B_or_D2B_bus
  - drive_D1CLK_or_D2CLK
  - enable_analog_output

signal_path:
  source:
    board: BeagleBone Black
    pru: PRU0_R30_15
    header_pin: P8_11
    voltage_v: 3.3
  rtase_input:
    net: SYM.A0
    cpld_pin: 85
    site: PR13B
    direction: input
    io_type: LVCMOS33
  observation:
    signal: dbg0
    cpld_pin: 117
    site: PT24A
    direction: output
    io_type: LVCMOS33
    drive_ma: 4
    slew: SLOW
    board_connection: NC_on_schematic
    scope_channel: CH3
    scope_termination: 1_Mohm

