schema_version: 1
test_id: gate3-rf1-demo
status: build_candidate_only

purpose:
  - Exercise the real BBB PRU to CPLD to DAC1 to RF1 data path.
  - Select one of four fixed 14-bit DAC codes from a two-bit BBB value.
  - Clock DAC1 only after the selected code has been stable for the PRU delay.

allowed_operations:
  - diamond_build

forbidden_operations:
  - sram_fast_program
  - nonvolatile_flash
  - drive_any_D2B_bus
  - drive_D2CLK
  - enable_analog_output

codes:
  CODE0: 0x0000
  CODE1: 0x1555
  CODE2: 0x2AAA
  CODE3: 0x3FFF
  meaning: evenly_spaced_raw_codes_not_voltage_calibration

signal_path:
  select:
    - {name: sym_a0, pru: PRU0_R30_15, bbb_pin: P8_11, board_net: SYM.A0, cpld_pin: 85}
    - {name: sym_a1, pru: PRU0_R30_14, bbb_pin: P8_12, board_net: SYM.A1, cpld_pin: 84}
  update:
    name: ldac_a
    pru: PRU0_R30_0
    bbb_pin: P9_31
    board_net: LDAC.A
    schematic_label_at_cpld: LDASC.A
    cpld_input_pin: 35
    cpld_output_net: D1CLK
    cpld_output_pin: 73
    dac: U6_AD9744_CLOCK_pin_28
  data:
    net: D1B[13:0]
    cpld_pins_lsb_to_msb: [56, 57, 58, 59, 60, 61, 62, 63, 65, 67, 68, 69, 70, 71]
    dac: U6_AD9744_DB0_to_DB13
  analog:
    path: U6_IOUTA_to_DAC1_OUT_to_U5_THS3491_to_RF1
    scope_channel: CH4
    scope_termination: 1_Mohm
    note: CN1 +/-15 V is required for U5 and is not approved by this build-only contract.

test_design:
  top: rtase_dac_demo
  timing_model: combinational_code_mux_and_clock_forward
  sources:
    hdl: QKD_PROJ/rtase_dac_demo/rtase_dac_demo.v
    constraints: QKD_PROJ/rtase_dac_demo/rtase_dac_demo.lpf
  outputs:
    - {name: "d1b[0]", cpld_pin: 56, io_type: LVCMOS33}

expected_user_io_count: 18

