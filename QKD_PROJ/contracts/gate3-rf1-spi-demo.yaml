schema_version: 1
test_id: gate3-rf1-spi-demo
status: fixed_candidate_programmed_spi_readback_failed

purpose:
  - Configure and read back four 14-bit CODE registers over BBB SPI0.
  - Keep Linux SPI outside the PRU real-time selection and update path.
  - Drive DAC1/RF1 only; leave DAC2 bus and clock unused.

allowed_operations: [diamond_build, jtag_scan]
forbidden_operations: [sram_fast_program, nonvolatile_flash, drive_any_D2B_bus, drive_D2CLK, enable_analog_output]

jtag:
  cable: Lattice HW-USBN-2B
  port: FTUSB-0
  header: U4

spi:
  mode: 0
  configured_speed_hz: 1000000
  timing_constraint_mhz: 10
  bit_order: MSB_first
  frame_bytes: 3
  command_byte:
    bit7: {write: 0, read: 1}
    bits6_2: must_be_zero
    bits1_0: register_address_0_to_3
  data_bytes: "00dddddd dddddddd (14-bit code)"
  read_transaction: "TX [0x80|addr, 0x00, 0x00], RX [0x00, code[13:8], code[7:0]]"
  write_transaction: "TX [addr, code[13:8], code[7:0]]"
  initial_codes: [0x0000, 0x1555, 0x2AAA, 0x3FFF]

signal_path:
  spi:
    - {name: spi_mosi, bbb_pin: P9_18, board_net: SPI.MOSI, cpld_pin: 31, direction: input}
    - {name: spi_cs_n, bbb_pin: P9_17, board_net: SPI.CS, cpld_pin: 32, direction: input}
    - {name: spi_miso, bbb_pin: P9_21, board_net: SPI.MISO, cpld_pin: 33, direction: output}
    - {name: spi_sclk, bbb_pin: P9_22, board_net: SPI.CLK, cpld_pin: 34, direction: input}
  select:
    - {name: sym_a0, pru: PRU0_R30_15, bbb_pin: P8_11, cpld_pin: 85}
    - {name: sym_a1, pru: PRU0_R30_14, bbb_pin: P8_12, cpld_pin: 84}
  update: {name: ldac_a, pru: PRU0_R30_0, bbb_pin: P9_31, cpld_input_pin: 35, d1clk_pin: 73}
  dac_data_pins_lsb_to_msb: [56, 57, 58, 59, 60, 61, 62, 63, 65, 67, 68, 69, 70, 71]

test_design:
  top: rtase_dac_spi
  timing_model: spi_sclk_registers_plus_combinational_code_mux_and_clock_forward
  sources:
    hdl: QKD_PROJ/rtase_dac_spi/rtase_dac_spi.v
    constraints: QKD_PROJ/rtase_dac_spi/rtase_dac_spi.lpf
  outputs:
    - {name: spi_miso, cpld_pin: 33, io_type: LVCMOS33}

