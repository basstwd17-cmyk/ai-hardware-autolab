test_id: gate7-spi-standard-ungated-loopback
status: candidate_approved

purpose:
  - Isolate the production-standard BBB SPI0 data path without CS, SCLK, DAC, SMA, or PRU outputs.
  - Echo U2 pin 31 directly to U2 pin 33 under the standard SPI0 pinmux.

allowed_operations: [diamond_build, jtag_scan, sram_fast_program, readback_or_program_status]
forbidden_operations: [nonvolatile_flash, drive_any_D1B_bus, drive_D1CLK, drive_any_D2B_bus, drive_D2CLK, enable_analog_output]

